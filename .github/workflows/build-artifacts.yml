name: Release
on:
  push:
  pull_request:
    branches: main

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_SIGNING_KEYS: ${{ secrets.KEYSTORE_BASE64 != '' && secrets.KEYSTORE_ALIAS != '' && secrets.KEYSTORE_PASSWORD != '' }}
    
    steps:
      - name: Checkout builds
        uses: actions/checkout@main

      - name: Setup JDK 17
        uses: actions/setup-java@main
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      
      - name: Setup credentials
        if: env.HAS_SIGNING_KEYS == 'true'
        run: |
          base64 -d <<< "$KEYSTORE_BASE64" > $HOME/keystore.jks
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          
      - name: Build signed release artifact
        if: env.HAS_SIGNING_KEYS == 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleRelease \
            -Pandroid.injected.signing.store.file="$HOME/keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build unsigned debug artifact
        if: env.HAS_SIGNING_KEYS != 'true'
        run: |
          chmod +x ./gradlew
          ./gradlew app:assembleDebug

      - uses: actions/upload-artifact@main
        with:
          name: VencordDev
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

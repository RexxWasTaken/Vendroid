name: Release

on:
push:
tags:
- 'v*'
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout source
    uses: actions/checkout@v4

  - name: Setup JDK 17 for Android SDK
    uses: actions/setup-java@v4
    with:
      java-version: '17'
      distribution: temurin

  - name: Setup Android SDK
    uses: android-actions/setup-android@v3

  - name: Install Android SDK packages
    run: |
      set -e
      sdkmanager --sdk_root="${ANDROID_HOME}" \
        "platform-tools" \
        "platforms;android-33" \
        "build-tools;33.0.2"

  - name: Setup JDK 11 for Gradle
    uses: actions/setup-java@v4
    with:
      java-version: '11'
      distribution: temurin

  - name: Setup credentials
    shell: bash
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    run: |
      set -e
      if [ -z "$KEYSTORE_BASE64" ]; then
        echo "Missing GitHub Secret: KEYSTORE_BASE64"
        exit 1
      fi
      echo "$KEYSTORE_BASE64" | base64 --decode > "$HOME/keystore.jks"
      test -s "$HOME/keystore.jks"

  - name: Get release tag
    shell: bash
    run: echo "RELEASE_TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"

  - name: Build Release APK
    shell: bash
    env:
      KEY_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
    run: |
      set -e
      chmod +x ./gradlew
      ./gradlew app:assembleRelease \
        -Pandroid.injected.signing.store.file="$HOME/keystore.jks" \
        -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
        -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
        -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      cp app/build/outputs/apk/release/app-release.apk \
        "Vendroid-${RELEASE_TAG}.apk"

  - name: Publish GitHub Release
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    run: |
      gh release create "$RELEASE_TAG" \
        "Vendroid-${RELEASE_TAG}.apk" \
        --generate-notes \
        --title "Vendroid ${RELEASE_TAG}"
